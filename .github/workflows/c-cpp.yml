name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcmocka-dev valgrind

      - name: Build
        run: make

      - name: Run tests
        run: make check

      - name: Run tests under valgrind
        run: |
          cd test && valgrind --leak-check=full --error-exitcode=1 ./test_wrapsrv

      - name: Build with sanitizers
        run: make asan

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cppcheck clang clang-tools

      - name: cppcheck
        run: >
          cppcheck
          --enable=all
          --error-exitcode=1
          --suppress=missingIncludeSystem
          wrapsrv.c

      - name: scan-build
        run: scan-build --status-bugs make

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y clang-format

      - name: Check formatting (advisory)
        run: clang-format --dry-run wrapsrv.c
